<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nome digitado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body>

    <h1 id="exercicioDois" class="text-center mb-4">

        <div class="form-floating">
            <input class="form-floating w-100 py-2" id="nomeCadastro" placeholder="Nome "

        </div>

        <div class="form-floating">
            <button id="btnCadastro" class="btn btn-primary w-100 py-2" type="submit"><font dir="auto" style="vertical-align: inherit;"><font dir="auto" style="vertical-align: inherit;">Cadastrar</font></font></button>

        <!-- Mensagem de feedback -->
        <p id="mensagem" class="fw-bold"></p>


        
        <footer id="rodape">
            <p>Todos os direitos preservados</p>
        </footer>
        
    </main>
  
    <!-- Script JavaScript -->
    <script src="script.js"></script>
