<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nome digitado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1 id="cadastro" class="text-center mb-4">
        Nome Cadastro
    </h1>

    <main id="conteudo">

        <input class="form-control" id="nomeCadastro" placeholder="Nome" type="text">

        <button id="btnCadastro" type="submit">Cadastrar</button>


        <!-- Mensagem de feedback -->
        <p id="mensagem" class="fw-bold"></p>


        <!-- Script JavaScript -->

        <footer id="rodape">
            <p>Todos os direitos preservados</p>
        </footer>

    </main>
    <script src="script.js"></script>
</body>

</html>
